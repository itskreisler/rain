name: Release

# Crea un tag semver y un release en cada push a main, cuando los commits
# desde el último tag incluyen un feat/fix (Conventional Commits). Los commits
# solo de docs/test/chore/ci no generan release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: tag y release
    runs-on: ubuntu-latest
    # Evita que el tag creado por este workflow dispare otro run.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para ver tags e historial

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calcular siguiente versión
        id: ver
        run: |
          if ./scripts/next-version.sh --bump; then
            version="$(./scripts/next-version.sh)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "Siguiente versión: ${version}"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Sin feat/fix desde el último tag: no se crea release."
          fi

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.bump == 'true'
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verificar tests y lint
        if: steps.ver.outputs.bump == 'true'
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Compilar binarios (linux amd64/arm64)
        if: steps.ver.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "${LDFLAGS}" -o "rain-linux-${arch}" .
          done
          sha256sum rain-linux-* > SHA256SUMS

      - name: Crear tag anotado
        if: steps.ver.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Publicar release
        if: steps.ver.outputs.bump == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            rain-linux-amd64
            rain-linux-arm64
            SHA256SUMS
