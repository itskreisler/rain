name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# Tokens en el mensaje del commit para saltar jobs completos:
#   [skip test]      -> Test y Verificación del CLI
#   [skip windows]   -> Smoke test y build de APK en Windows
#   [skip examples]  -> Build de Ejemplos con Rain
#   [skip release]   -> Publicación de Release
# Un job saltado no bloquea el release; un job que falle de verdad sí lo bloquea.

jobs:
  test:
    name: Test y Verificación del CLI
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Descargar módulos
        run: go mod download

      - name: Compilar binario
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Ejecutar Tests
        run: go test ./...

      - name: Probar Comandos del Binario
        run: |
          go build -o rain .
          ./rain version
          ./rain doctor
          ./rain check --help

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  windows-smoke:
    name: Smoke test y build de APK en Windows
    if: ${{ !contains(github.event.head_commit.message, '[skip windows]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Compilar, vet y tests
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Compilar binario y probar CLI
        shell: pwsh
        run: |
          go build -trimpath -o rain.exe .
          .\rain.exe version
          .\rain.exe doctor --help

      # doctor devuelve 3 cuando faltan herramientas del sistema; en un runner
      # limpio es esperado, pero queremos comprobar que el JSON se genera.
      - name: Generar informe doctor en JSON
        shell: pwsh
        continue-on-error: true
        run: .\rain.exe doctor --json

      # windows-latest ya trae Chocolatey, pero ejecutamos el script oficial
      # para verificar que la instalación documentada sigue funcionando.
      - name: Verificar script de instalación de Chocolatey
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

      - name: Chocolatey disponible para --install
        shell: pwsh
        run: choco --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Plantilla simple: Java sin dependencias, así que el build es rápido y
      # comprueba el pipeline completo (aapt2, d8, zipalign y apksigner) en
      # Windows sin descargar AndroidX/Compose.
      - name: Generar y compilar APK con la plantilla simple
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\rain.exe doctor --fix --profile simple
          .\rain.exe init --template simple --name SmokeWindows --non-interactive --dir smoke-windows
          Push-Location smoke-windows
          try {
            ..\rain.exe --devlog build
            if (-not (Test-Path 'app/build/app-debug.apk')) {
              throw 'No se generó app/build/app-debug.apk'
            }
            Get-Item 'app/build/app-debug.apk' | Select-Object FullName, Length
          } finally {
            Pop-Location
          }
          .\rain.exe doctor --fix --profile complex
          .\rain.exe init --template completo --name SmokeConfetti --non-interactive --dir smoke-confetti
          Push-Location smoke-confetti
          try {
            ..\rain.exe --devlog build
            if (-not (Test-Path 'app/build/app-debug.apk')) {
              throw 'No se generó app/build/app-debug.apk'
            }
            java -jar "$env:USERPROFILE\.rain\toolchain\apksigner.jar" verify --verbose 'app/build/app-debug.apk'
            Get-Item 'app/build/app-debug.apk' | Select-Object FullName, Length
          } finally {
            Pop-Location
          }

  build-and-test-examples:
    name: Build de Ejemplos con Rain
    needs: test
    # always() para que [skip test] no arrastre este job; se sigue exigiendo
    # que test haya pasado o se haya saltado, nunca que haya fallado.
    if: ${{ always() && !contains(github.event.head_commit.message, '[skip examples]') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Instalar JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip

      - name: Compilar binario rain
        run: go build -trimpath -o rain .

      - name: Instalar toolchain (aapt2, R8, apksigner, android.jar, kotlinc)
        run: ./rain doctor --fix --profile complex

      # Los ejemplos se comprueban en debug y release. En CI no hay keystore
      # propia: --allow-debug-signing permite validar el pipeline de release.
      - name: Compilar Ejemplo Compose (FireIcon) [debug]
        working-directory: examples/compose
        run: ../../rain build

      - name: Verificar APK Compose [debug]
        working-directory: examples/compose
        run: |
          set -eu
          APK=app/build/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Compose (FireIcon) [release]
        working-directory: examples/compose
        run: ../../rain build --release --allow-debug-signing

      - name: Verificar APK Compose [release]
        working-directory: examples/compose
        run: |
          set -eu
          APK=app/build/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Material 3 Expressive [debug]
        working-directory: examples/expressive
        run: ../../rain build

      - name: Verificar APK Material 3 Expressive [debug]
        working-directory: examples/expressive
        run: |
          set -eu
          APK=app/build/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Material 3 Expressive [release]
        working-directory: examples/expressive
        run: ../../rain build --release --allow-debug-signing

      - name: Verificar APK Material 3 Expressive [release]
        working-directory: examples/expressive
        run: |
          set -eu
          APK=app/build/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Liquid Glass Music Player [debug]
        working-directory: examples/liquid-glass
        run: ../../rain build

      - name: Verificar APK Liquid Glass Music Player [debug]
        working-directory: examples/liquid-glass
        run: |
          set -eu
          APK=app/build/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Liquid Glass Music Player [release]
        working-directory: examples/liquid-glass
        run: ../../rain build --release --allow-debug-signing

      - name: Verificar APK Liquid Glass Music Player [release]
        working-directory: examples/liquid-glass
        run: |
          set -eu
          APK=app/build/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Comprobar Ejemplo Backdrop Music (MediaStore + backdrop) [debug]
        working-directory: examples/backdrop-music
        run: ../../rain check

      - name: Comprobar Ejemplo Backdrop Music (MediaStore + backdrop) [release]
        working-directory: examples/backdrop-music
        run: ../../rain check --release

      - name: Compilar Ejemplo Layout Plano (Hello Buddy) [debug]
        working-directory: examples/hello-buddy
        run: ../../rain build

      - name: Verificar APK Layout Plano [debug]
        working-directory: examples/hello-buddy
        run: |
          set -eu
          APK=build/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Layout Plano (Hello Buddy) [release]
        working-directory: examples/hello-buddy
        run: ../../rain build --release --allow-debug-signing

      - name: Verificar APK Layout Plano [release]
        working-directory: examples/hello-buddy
        run: |
          set -eu
          APK=build/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Layout Simple [debug]
        working-directory: examples/layoutsimple
        run: ../../rain build

      - name: Verificar APK Layout Simple [debug]
        working-directory: examples/layoutsimple
        run: |
          set -eu
          APK=build/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Layout Simple [release]
        working-directory: examples/layoutsimple
        run: ../../rain build --release --allow-debug-signing

      - name: Verificar APK Layout Simple [release]
        working-directory: examples/layoutsimple
        run: |
          set -eu
          APK=build/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Contador de Cofres [debug]
        working-directory: examples/contador-cofres
        run: ../../rain build

      - name: Verificar APK Contador de Cofres [debug]
        working-directory: examples/contador-cofres
        run: |
          set -eu
          APK=app/build/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - name: Compilar Ejemplo Contador de Cofres [release]
        working-directory: examples/contador-cofres
        run: ../../rain build --release --allow-debug-signing

      - name: Verificar APK Contador de Cofres [release]
        working-directory: examples/contador-cofres
        run: |
          set -eu
          APK=app/build/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          java -jar ~/.rain/toolchain/apksigner.jar verify --verbose "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: apks-ejemplos
          path: |
            examples/compose/app/build/app-debug.apk
            examples/compose/app/build/app-release.apk
            examples/liquid-glass/app/build/app-debug.apk
            examples/liquid-glass/app/build/app-release.apk
            examples/hello-buddy/build/app-debug.apk
            examples/hello-buddy/build/app-release.apk
            examples/layoutsimple/build/app-debug.apk
            examples/layoutsimple/build/app-release.apk
            examples/contador-cofres/app/build/app-debug.apk
            examples/contador-cofres/app/build/app-release.apk

  release:
    name: Publicación de Release
    needs: [test, windows-smoke, build-and-test-examples]
    # always() permite publicar aunque los jobs previos se hayan saltado,
    # pero sigue bloqueando si cualquiera de ellos falló de verdad.
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.windows-smoke.result == 'success' || needs.windows-smoke.result == 'skipped') && (needs.build-and-test-examples.result == 'success' || needs.build-and-test-examples.result == 'skipped') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calcular siguiente versión
        id: ver
        run: |
          if ./scripts/next-version.sh --bump; then
            version="$(./scripts/next-version.sh)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "Siguiente versión: ${version}"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios desde el último tag: no se crea release."
          fi

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.bump == 'true'
        with:
          go-version: 'stable'
          cache: true

      - name: Compilar binarios estáticos (linux y windows amd64/arm64)
        if: steps.ver.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          for os in linux windows; do
            for arch in amd64 arm64; do
              out="rain-${os}-${arch}"
              if [ "${os}" = windows ]; then out="${out}.exe"; fi
              GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "${LDFLAGS}" -o "${out}" .
            done
          done
          sha256sum rain-linux-* rain-windows-* > SHA256SUMS

      - name: Crear tag anotado
        if: steps.ver.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Publicar release
        if: steps.ver.outputs.bump == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            rain-linux-amd64
            rain-linux-arm64
            rain-windows-amd64.exe
            rain-windows-arm64.exe
            SHA256SUMS
