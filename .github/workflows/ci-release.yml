name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests & Build Samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Build Rain CLI binary
        run: go build -o rain .

      - name: Verify Rain CLI on Simple App
        run: |
          cd samples/simple-app
          ../../rain init || true
          test -f rain.toml

      - name: Verify Rain CLI on Compose App
        run: |
          cd samples/compose-app
          ../../rain init || true
          test -f rain.toml

  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/rain-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/rain-linux-arm64 .
          GOOS=linux GOARCH=arm go build -ldflags="-s -w" -o dist/rain-linux-arm .

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/rain-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/rain-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/rain-windows-amd64.exe .

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rain-linux-amd64
            dist/rain-linux-arm64
            dist/rain-linux-arm
            dist/rain-darwin-amd64
            dist/rain-darwin-arm64
            dist/rain-windows-amd64.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
