name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Build Sample APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK Build-Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Added $BUILD_TOOLS_DIR to PATH"

      - name: Install Kotlin Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y kotlin

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Build Rain CLI binary
        run: go build -o rain .

      - name: Locate Android JAR
        id: sdk
        run: |
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "android_jar=$ANDROID_JAR" >> $GITHUB_OUTPUT
          echo "Found android.jar at $ANDROID_JAR"

      - name: Test Rain Build (Debug, Release, Clean) on Simple App
        run: |
          ANDROID_JAR="${{ steps.sdk.outputs.android_jar }}"
          cd samples/simple-app
          ../../rain build --android-jar "$ANDROID_JAR"
          ../../rain build --android-jar "$ANDROID_JAR" -release
          ../../rain clean

      - name: Test Rain Build (Debug, Release, Clean) on Compose App
        run: |
          ANDROID_JAR="${{ steps.sdk.outputs.android_jar }}"
          cd samples/compose-app
          ../../rain build --android-jar "$ANDROID_JAR"
          ../../rain build --android-jar "$ANDROID_JAR" -release
          ../../rain clean

      - name: Test Rain Build (Debug, Release, Clean) on Material3 Expressive App
        run: |
          ANDROID_JAR="${{ steps.sdk.outputs.android_jar }}"
          cd samples/material3-expressive
          ../../rain build --android-jar "$ANDROID_JAR"
          ../../rain build --android-jar "$ANDROID_JAR" -release
          ../../rain clean

  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse draft release
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            let release = releases.find((r) => r.draft && r.tag_name === tag);
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Rain ${tag}`,
                body: `Release ${tag} of Rain Android build tool binary artifacts.`,
                draft: true,
                prerelease: false,
              }));
            }
            core.setOutput('release_id', String(release.id));

  build-release:
    name: Build & Upload Binaries
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Cross-Compile Binaries
        run: |
          mkdir -p dist

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/rain-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/rain-linux-arm64 .
          cp dist/rain-linux-arm64 dist/rain-linux-aarch64
          GOOS=linux GOARCH=arm go build -ldflags="-s -w" -o dist/rain-linux-arm .

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/rain-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/rain-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/rain-windows-amd64.exe .

          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload Release Assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const release_id = Number(process.env.RELEASE_ID);
            const distDir = 'dist';
            const files = fs.readdirSync(distDir);

            for (const file of files) {
              const filePath = path.join(distDir, file);
              const data = fs.readFileSync(filePath);
              console.log(`Uploading ${file} to release ${release_id}...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: file,
                data: data
              });
            }

  publish-release:
    name: Publish release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
