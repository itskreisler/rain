mode = "completo"

dependencies = [
    "androidx.activity:activity-compose:1.8.2",
    "androidx.compose.material3:material3-android:1.5.0-beta01",
    "androidx.core:core-ktx:1.13.1",
]

[project]
name = "Contador"
package = "com.kleilabs.piratetokencounter"
version = "1.0"

[build]
# La superposición flotante usa TYPE_APPLICATION_OVERLAY, que existe desde
# Android 8.0 (API 26).
min_sdk = 26
target_sdk = 36

# Firma de release: descomenta el bloque y apunta a tu propia keystore para
# publicar la app. `release.keystore` está en .gitignore, así que no existe en
# un checkout limpio (ni en CI): los builds de release se validan con
# `rain build --release --allow-debug-signing`, que usa la keystore de debug.
# No subas nunca tu keystore ni sus contraseñas al repositorio.
# [signing]
# store_file = "release.keystore"
# store_password = "contador"
# key_alias = "contador"
# key_password = "contador"
